name: iosApp
options:
  bundleIdPrefix: com.uxcam.kmp
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  UXCam:
    url: https://github.com/uxcam/uxcam-ios
    exactVersion: 3.10.0

targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: UXCam KMP
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uxcam.kmp.sample.ios
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "NO"
    # Shared.xcframework carries the Kotlin bindings; SwiftPM supplies the native UXCam SDK,
    # its linker settings, and its privacy manifest at the final app link.
    dependencies:
      - framework: ../examples/shared/build/XCFrameworks/release/Shared.xcframework
        embed: false
      - package: UXCam
