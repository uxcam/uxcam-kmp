name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, test, and check manifests
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Unit tests (uxcam-kmp, uxcam-compose)
        run: ./gradlew jvmTest

      - name: Gradle plugin tests
        run: ./gradlew -p gradle-plugin test

      - name: iOS cinterop compiles (downloads + checksums the native SDK)
        run: ./gradlew :uxcam-kmp:compileKotlinIosSimulatorArm64

      - name: Android sample assembles
        run: ./gradlew :androidApp:assembleDebug

      - name: Validate Package.swift
        run: swift package dump-package >/dev/null

      - name: Check manifest versions agree with the version catalog
        run: |
          catalog_kmp="$(sed -n 's/^uxcamKmp = "\([^"]*\)".*$/\1/p' gradle/libs.versions.toml)"
          catalog_ios="$(sed -n 's/^uxcamIos = "\([^"]*\)".*$/\1/p' gradle/libs.versions.toml)"
          package_version="$(sed -n 's/^let version = "\([^"]*\)".*$/\1/p' Package.swift)"
          package_ios="$(sed -n 's/^.*uxcam\/uxcam-ios", exact: "\([^"]*\)".*$/\1/p' Package.swift)"
          if [[ "$package_version" != "$catalog_kmp" && "$package_version" != "0.0.0-unreleased" ]]; then
            echo "::error::Package.swift version ('$package_version') does not match uxcamKmp in libs.versions.toml ('$catalog_kmp')"
            exit 1
          fi
          if [[ -z "$package_ios" || "$package_ios" != "$catalog_ios" ]]; then
            echo "::error::Package.swift pins uxcam-ios '$package_ios' but libs.versions.toml says '$catalog_ios'"
            exit 1
          fi

      - name: Forbid tracked binary artifacts
        run: |
          forbidden="$(git ls-files | grep -E '\.(a|zip|framework|xcframework)(/|$)' || true)"
          if [[ -n "$forbidden" ]]; then
            echo "::error::Binary distribution artifacts must not be tracked"
            echo "$forbidden"
            exit 1
          fi
