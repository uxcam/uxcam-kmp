# Release flow:
#   1. Create `release/<x.y.z>` from main and push it. prepare-release.yml validates the branch,
#      bumps uxcamKmp, and leaves the branch ready for a manually reviewed PR.
#   2. Merge that PR into main. This workflow builds UXCamKMP.xcframework.zip, stamps the exact
#      version + checksum into Package.swift on a release-only commit, creates the immutable
#      `v<x.y.z>` tag, and publishes the GitHub and Maven Central releases.
#
# The release-only commit is deliberately tagged without being pushed to main. Package.swift on
# main stays at 0.0.0-unreleased; each published tag contains the exact asset URL and checksum.
#
# Manual dispatch is recovery-only: provide an existing version to retry Maven Central and finish
# publishing an existing draft GitHub release without rebuilding or moving its tag.
#
# Secrets: SIGNING_KEY, SIGNING_PASSWORD, OSSRH_USERNAME, OSSRH_PASSWORD (Central Portal
# user token; see build-logic/src/main/kotlin/uxcam-publishing.gradle.kts), optional
# SLACK_WEBHOOK_URL.
# Variables: MAVEN_PUBLISH_ENABLED (gates the Central half), MAVEN_CENTRAL_AUTO_PUBLISH.

name: Release

on:
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release version to retry"
        required: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, tag, and publish release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          # A fresh release is pinned to the reviewed merge commit. A retry is pinned to the
          # existing immutable release tag.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.event.pull_request.merge_commit_sha }}
          persist-credentials: true

      - name: Resolve release request
        id: release
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request_target" ]]; then
            version="${HEAD_BRANCH#release/}"
            publish_only=false
          else
            version="$INPUT_VERSION"
            publish_only=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish_only=$publish_only" >> "$GITHUB_OUTPUT"

      - name: Validate release request
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          VERSION: ${{ steps.release.outputs.version }}
          PUBLISH_ONLY: ${{ steps.release.outputs.publish_only }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must be x.y.z, got '$VERSION'"
            exit 1
          fi

          if [[ "$PUBLISH_ONLY" == "true" ]]; then
            if ! git ls-remote --exit-code origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
              echo "::error::publish-only retry requested but tag v$VERSION does not exist"
              exit 1
            fi
            echo "Tag v$VERSION exists; retrying publication without rebuilding or retagging."
            exit 0
          fi

          if [[ "$HEAD_BRANCH" != "release/$VERSION" ]]; then
            echo "::error::Release branch must be exactly release/$VERSION"
            exit 1
          fi
          catalog="$(sed -n 's/^uxcamKmp = "\([^"]*\)".*$/\1/p' gradle/libs.versions.toml)"
          if [[ "$catalog" != "$VERSION" ]]; then
            echo "::error::uxcamKmp is '$catalog', but merged release branch requested '$VERSION'"
            exit 1
          fi
          if git ls-remote --exit-code origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists — release tags are never moved"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build UXCamKMP.xcframework.zip
        if: steps.release.outputs.publish_only != 'true'
        run: |
          ./gradlew :uxcam-kmp:assembleUXCamKMPXCFramework
          out="uxcam-kmp/build/XCFrameworks/release"
          (cd "$out" && zip -qry UXCamKMP.xcframework.zip UXCamKMP.xcframework)
          cp "$out/UXCamKMP.xcframework.zip" "$RUNNER_TEMP/UXCamKMP.xcframework.zip"

      - name: Stamp Package.swift
        if: steps.release.outputs.publish_only != 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          checksum="$(swift package compute-checksum "$RUNNER_TEMP/UXCamKMP.xcframework.zip")"
          sed -i '' "s/^let version = \".*\"$/let version = \"$VERSION\"/" Package.swift
          sed -i '' "s/^let checksum = \".*\"$/let checksum = \"$checksum\"/" Package.swift
          swift package dump-package >/dev/null

      - name: Create immutable release tag
        if: steps.release.outputs.publish_only != 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "mobile-uxcam"
          git config user.email "mobile@uxcam.com"
          git add Package.swift
          git commit -m "Release $VERSION"
          git tag "v$VERSION"
          git push origin "refs/tags/v$VERSION"

      - name: Create draft GitHub release with the asset
        if: steps.release.outputs.publish_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            "$RUNNER_TEMP/UXCamKMP.xcframework.zip" \
            --draft \
            --title "v$VERSION" \
            --generate-notes

      - name: Stage, bundle, and upload to Maven Central
        if: vars.MAVEN_PUBLISH_ENABLED == 'true'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          UXCAM_MAVEN_CENTRAL_AUTO_PUBLISH: ${{ vars.MAVEN_CENTRAL_AUTO_PUBLISH || 'false' }}
        run: |
          if [[ -z "$SIGNING_KEY" || -z "$OSSRH_USERNAME" ]]; then
            echo "::error::Maven publishing is enabled but SIGNING_KEY/OSSRH_USERNAME secrets are missing"
            exit 1
          fi
          # Both builds stage into ONE directory so a single bundle covers the whole
          # release; gradle-plugin is an included build with its own rootProject, hence
          # the explicit -PuxcamStagingDir.
          STAGING="$GITHUB_WORKSPACE/build/maven-central-staging"
          rm -rf "$STAGING"
          ./gradlew --no-configuration-cache -PuxcamStagingDir="$STAGING" \
                    :uxcam-kmp:publishAllPublicationsToCentralStagingRepository \
                    :uxcam-compose:publishAllPublicationsToCentralStagingRepository
          ./gradlew --no-configuration-cache -PuxcamStagingDir="$STAGING" \
                    -p gradle-plugin publishAllPublicationsToCentralStagingRepository
          scripts/publish-central.sh "${{ steps.release.outputs.version }}" "$STAGING"

      - name: Publish the GitHub release
        if: vars.MAVEN_PUBLISH_ENABLED == 'true' && vars.MAVEN_CENTRAL_AUTO_PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [[ "$(gh release view "v$VERSION" --json isDraft --jq .isDraft)" == "true" ]]; then
            gh release edit "v$VERSION" --draft=false --latest
            echo "Published GitHub release v$VERSION"
          else
            echo "GitHub release v$VERSION is already published."
          fi

      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.release.outputs.version }}
          AUTO_PUBLISH: ${{ vars.MAVEN_PUBLISH_ENABLED == 'true' && vars.MAVEN_CENTRAL_AUTO_PUBLISH == 'true' }}
        run: |
          if [[ -z "$SLACK_WEBHOOK_URL" ]]; then
            echo "SLACK_WEBHOOK_URL is not configured; notification skipped."
            exit 0
          fi
          if [[ "$AUTO_PUBLISH" == "true" ]]; then
            text=":rocket: UXCam KMP SDK $VERSION released — live on Maven Central and GitHub: $RELEASE_URL"
          else
            text=":package: UXCam KMP SDK $VERSION is staged and awaiting review — publish the GitHub draft ($RELEASE_URL) and the Central deployment (https://central.sonatype.com/publishing/deployments)"
          fi
          jq -n --arg text "$text" '{text:$text}' \
            | curl --fail-with-body --retry 3 \
                -H 'Content-Type: application/json' \
                --data-binary @- \
                "$SLACK_WEBHOOK_URL"
